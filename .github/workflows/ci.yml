name: CI

# Every push and every pull request: the tests, the formatter, no warnings.
# And, on Windows, the launcher, which is compiled from C there, and the
# print script's own tests that need Windows PowerShell - so that a Windows
# build that no longer builds is found on the push that broke it and not on
# the day of a release.
#
# Two more, because half of Polis lives somewhere else. The OpenPairings
# plugin (plugins/openpairings_polis) is compiled into OpenPairings' hosted
# edition and nowhere here, so its tests run inside an OpenPairings checkout.
# And the hall-link contract both halves speak is OpenPairings'
# (priv/contracts/vendor): compared with the provider's on every push and
# once a day, since OpenPairings can move without Polis having a commit.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 5 * * *" # daily, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    if: github.event_name != 'schedule'
    # Named, not `ubuntu-latest`: that label moves, and it should move here
    # when somebody decides it does.
    runs-on: ubuntu-24.04

    steps:
      # Actions are pinned to a commit, not to a tag: a tag can be moved, and
      # whoever moves it runs their code here. The comment is the version a
      # person reads; .github/dependabot.yml keeps the pair current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29.0"

      - name: Restore dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp29.0-ex1.20-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-otp29.0-ex1.20-

      # --check-locked: a constraint edited in mix.exs without the lock file
      # would otherwise be resolved here, silently, into a set of
      # dependencies nobody committed.
      - name: Install dependencies
        run: mix deps.get --check-locked

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Audit dependencies
        run: |
          mix deps.audit
          mix hex.audit

      - name: Sobelow
        # Findings reviewed in context live in .sobelow-skips; a NEW finding fails here.
        run: mix sobelow --config

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      # The installer scripts run as root on somebody's box and cannot be
      # run here. They can at least be read by something stricter than sh.
      - name: Lint the Linux installer scripts
        run: |
          for script in rel/linux/*.sh; do
            sh -n "$script"
          done
          shellcheck --shell=sh --severity=warning rel/linux/*.sh

  windows:
    name: Windows builds (launcher, print script)
    if: github.event_name != 'schedule'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29.0.5"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore dependencies and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-otp29.0.5-ex1.20-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-otp29.0.5-ex1.20-

      - run: mix deps.get --check-locked

      - run: mix compile --warnings-as-errors

      # The print script runs under Windows PowerShell 5.1 on the hall's PC
      # and nowhere here. It is parsed by that very PowerShell, which finds
      # the syntax errors a test on Linux cannot; nothing is printed.
      - name: Parse the print script with Windows PowerShell
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "priv/print/print.ps1"), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host "print.ps1 parses under PowerShell $($PSVersionTable.PSVersion)"

      - name: Build the launcher
        shell: pwsh
        run: |
          .\rel\windows\build_launcher.ps1 -OutputPath "$env:RUNNER_TEMP\Polis.exe"

  plugin:
    name: OpenPairings plugin tests (hosted edition)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      # The hosted edition, with this repository's plugins and no others.
      PAIRINGS_EDITION: hosted
      PAIRINGS_PLUGINS_DIR: ${{ github.workspace }}/hall/plugins
      # OpenPairings' own CI skips the same three: fixtures that are not in
      # its repository, and a 32-bit binary this runner cannot start.
      SKIP_MISSING_ARTIFACTS: swar_fixture,snapshot_fixtures,bbppairings

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hall

      # OpenPairings as it is on main: the plugin has to work against the
      # server that will run it, not against the one it was written for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: teapot-chess/openpairings
          ref: main
          path: openpairings

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            openpairings/deps
            openpairings/_build
          key: ${{ runner.os }}-mix-plugin-otp29.0-ex1.20-${{ hashFiles('openpairings/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-plugin-otp29.0-ex1.20-

      - name: Install OpenPairings' dependencies
        working-directory: openpairings
        run: mix deps.get --check-locked

      - name: Compile with the plugin
        working-directory: openpairings
        run: mix compile --warnings-as-errors

      - name: Check the plugin's formatting (OpenPairings' rules)
        working-directory: openpairings
        run: mix format --check-formatted

      - name: Run the plugin's tests
        working-directory: openpairings
        run: mix test "${{ github.workspace }}/hall/plugins/openpairings_polis/test"

  contracts:
    name: Contracts match their providers
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29.0"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-contracts-otp29.0-ex1.20-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-contracts-otp29.0-ex1.20-

      - run: mix deps.get --check-locked

      # Fetches OpenPairings' hall-link-v1 from GitHub and fails, naming the
      # files, if it is not byte for byte the vendored copy. The fix is
      # `mix contracts.sync`, the tests (here and the plugin's), and whatever
      # they then say.
      - name: Compare the vendored contract with OpenPairings'
        run: mix contracts.check
